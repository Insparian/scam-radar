name = "insparian-scam-radar-scheduler"
# Replace only with the reviewed dedicated ID in config/cloudflare-account.json.
# All-zero sentinel makes direct Wrangler writes fail before account activation.
account_id = "00000000000000000000000000000000"
main = "src/index.mjs"
compatibility_date = "2026-10-07"
workers_dev = false
send_metrics = false

# 07:17, 13:17, 20:17 Asia/Shanghai; Cloudflare Cron uses UTC.
[triggers]
crons = ["17 5,12,23 * * *"]

# No live bindings are committed. Missing ENABLED keeps every cron invocation inert.
